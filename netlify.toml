# Configuración de Netlify para Cannabicos
# La página es estática: no hay comando de build y se publica la raíz del repositorio.

[build]
  publish = "."

# Encabezados de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# El catálogo se revisa en cada visita para que los cambios del panel se vean rápido
[[headers]]
  for = "/productos.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El archivo de configuración del panel no necesita ser público
[[redirects]]
  from = "/.pages.yml"
  to = "/404.html"
  status = 404
  force = true
